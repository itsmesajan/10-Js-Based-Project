<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes App</title>
    <link rel="shortcut icon" href="../img/note.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/1.1.1/marked.min.js"></script>

    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <i class="fas fa-note-sticky"></i>
        <h1>Notes</h1>
        <span id="count" class="count">0</span>
      </div>

      <label class="search">
        <i class="fas fa-magnifying-glass"></i>
        <input id="search" type="search" placeholder="Search notes" aria-label="Search notes" />
        <kbd>/</kbd>
      </label>

      <button id="add" class="add" title="New note (N)">
        <i class="fas fa-plus"></i><span>New note</span>
      </button>
    </header>

    <main>
      <section id="notes" class="notes-grid" aria-live="polite"></section>

      <div id="empty" class="empty-state hidden">
        <i class="fas fa-feather-pointed"></i>
        <h2>No notes yet</h2>
        <p>Capture your first idea. Notes support <strong>Markdown</strong> and save automatically.</p>
        <button class="add" data-add><i class="fas fa-plus"></i><span>Create a note</span></button>
        <p class="hint">Tip: press <kbd>N</kbd> anywhere to start a new note</p>
      </div>

      <div id="no-results" class="empty-state hidden">
        <i class="fas fa-magnifying-glass"></i>
        <h2>No matching notes</h2>
        <p>Try a different search term.</p>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite">
      <span class="toast-msg">Note deleted</span>
      <button class="toast-undo">Undo</button>
    </div>
  </body>
</html>
